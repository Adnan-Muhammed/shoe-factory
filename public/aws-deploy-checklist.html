<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWS Deployment Master Checklist with AI Prompts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4;--surface:#fff;--surface2:#f0f0ed;--line:#e4e4e0;--text:#26282b;--muted:#6d717a;
  --accent:#4f6a8f;--accent-soft:#e8edf4;--ok:#5b8a6e;--ok-soft:#e6f0ea;--note:#f4f1e8;
  --shadow:0 1px 2px rgba(20,24,30,.04);
  --f:"Inter","Noto Sans Malayalam",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#17181a;--surface:#1f2124;--surface2:#272a2e;--line:#2f3237;--text:#e3e4e6;--muted:#9a9ea6;
  --accent:#8fa8c9;--accent-soft:#252c36;--ok:#7fb393;--ok-soft:#222d27;--note:#2a2820;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(88px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.65 var(--f);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

header.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar-title{font-weight:600;font-size:15px;white-space:nowrap}
.prog{flex:1;min-width:0}
.prog-track{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s ease}
.prog-txt{font-size:12px;color:var(--muted);margin-top:3px;text-align:right}
.theme{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.theme svg{width:18px;height:18px}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}

main{max-width:760px;margin:0 auto;padding:36px 16px 80px}
.hero h1{font-size:clamp(24px,5vw,32px);line-height:1.25;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.tools{display:flex;gap:8px;margin:22px 0 4px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

section{margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 10px}
.sec-head h2{margin:0;font-size:16px;font-weight:600}
.sec-head span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.row{display:flex;align-items:stretch}
.check{flex:none;width:52px;display:grid;place-items:center}
.check i{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--muted);display:grid;place-items:center;transition:.2s}
.check svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:.2s}
.item.done .check i{background:var(--ok);border-color:var(--ok)}
.item.done .check svg{opacity:1;transform:none}
.toggle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px 15px 0}
.num{flex:none;min-width:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.topic{flex:1;min-width:0;font-weight:500;transition:.2s}
.item.done .topic{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;display:none}
.item.has-note .dot{display:block}
.chev{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .25s}
.item.open .chev{transform:rotate(180deg)}

.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .drawer{grid-template-rows:1fr}
.drawer>div{overflow:hidden}
.body{padding:2px 16px 18px 52px;display:grid;gap:12px}
.action{margin:0}
.hint{margin:0;padding:10px 12px;border-radius:10px;background:var(--note);font-size:13.5px;color:var(--muted)}
.yt{display:inline-flex;align-items:center;gap:8px;color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:500;width:fit-content;max-width:100%}
.yt svg{width:18px;height:18px;flex:none}
.yt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yt:hover span{text-decoration:underline}
textarea{width:100%;min-height:96px;resize:vertical;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit;font-size:14px;line-height:1.6;transition:border-color .2s}
textarea:focus{outline:0;border-color:var(--accent)}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.save{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:10px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:500}
:root[data-theme="dark"] .save{color:#14181d}
.save svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.save:active{transform:scale(.97)}
.saved{font-size:12.5px;color:var(--ok);opacity:0;transition:opacity .25s}
.saved.show{opacity:1}

.prompts{display:grid;gap:8px}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600}
.p-list{display:grid;gap:8px}
.pcard{display:flex;gap:10px;align-items:flex-start;padding:10px 10px 10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.pcard p{margin:0;flex:1;min-width:0;font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.copy,.copy-all{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:12.5px;font-weight:500;white-space:nowrap;flex:none}
.copy:hover,.copy-all:hover{background:var(--accent-soft)}
.copy.ok,.copy-all.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.copy svg,.copy-all svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.pcard{flex-direction:column;gap:8px}.copy{align-self:flex-end}}
.empty{text-align:center;color:var(--muted);padding:40px 0;display:none}

@media (max-width:520px){
  .bar-title{display:none}
  .body{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">

</header>

<main>

</main>

  try{localStorage.setItem(TKEY,theme)}catch(e){}

        <div class="actions">
          <button class="save"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Save notes</button>
          <span class="saved">Saved</span>
        </div>
      </div></div></div>`;
    el.querySelector(".topic").textContent=topic;
    el.querySelector(".action").textContent=action;
    if(mid)el.querySelector(".hint").textContent=mid;
    const a=el.querySelector(".yt");
    a.href="https://www.youtube.com/watch?v="+v[1];
    a.querySelector("span").textContent=v[0];
    const pl=el.querySelector(".p-list");
    (PROMPTS[id]||[]).forEach(t=>{
      const c=document.createElement("div"); c.className="pcard";
      c.innerHTML=`<p></p><button class="copy">${CP}Copy</button>`;
      c.querySelector("p").textContent=t; pl.appendChild(c);
    });
    const ta=el.querySelector("textarea");
    ta.value=get(id).note;
    sync(el);
    list.appendChild(el);
  });
  s.dataset.total=sec.items.length;
  app.appendChild(s);
});

function sync(el){
  const st=get(+el.dataset.id);
  el.classList.toggle("done",st.done);
  el.classList.toggle("has-note",!!st.note.trim());
  el.querySelector(".check").setAttribute("aria-pressed",st.done);
}

/* ---------- Progress & filter ---------- */
let filter="all";
function update(){
  const total=ids.length, done=ids.filter(i=>get(i).done).length;
  document.getElementById("fill").style.width=(done/total*100)+"%";
  document.getElementById("ptxt").textContent=`${done} of ${total} completed`;
  let shown=0;
  app.querySelectorAll("section").forEach(sec=>{
    let vis=0,dn=0;
    sec.querySelectorAll(".item").forEach(el=>{
      const d=get(+el.dataset.id).done; if(d)dn++;
      const show=filter==="all"||(filter==="done"?d:!d);
      el.hidden=!show; if(show)vis++;
    });
    sec.hidden=!vis; shown+=vis;
    sec.querySelector(".sec-head span").textContent=`${dn}/${sec.dataset.total}`;
  });
  document.getElementById("empty").style.display=shown?"none":"block";
}
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
  update();
});

/* ---------- Clipboard ---------- */
function legacyCopy(t){
  const a=document.createElement("textarea"); a.value=t; a.style.cssText="position:fixed;opacity:0;top:0";
  document.body.appendChild(a); a.select(); let ok=false;
  try{ok=document.execCommand("copy")}catch(e){}
  a.remove(); return ok;
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)
    return navigator.clipboard.writeText(t).then(()=>true,()=>legacyCopy(t));
  return Promise.resolve(legacyCopy(t));
}
function flash(btn,ok){
  if(btn._orig===undefined)btn._orig=btn.innerHTML;
  btn.innerHTML=TICK_S+(ok?"Copied":"Copy failed");
  btn.classList.toggle("ok",ok);
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{btn.innerHTML=btn._orig;btn.classList.remove("ok");btn._orig=undefined},1600);
}
const TICK_S='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Events ---------- */
app.addEventListener("click",e=>{
  const el=e.target.closest(".item"); if(!el)return;
  const id=+el.dataset.id;
  const cb=e.target.closest(".copy,.copy-all");
  if(cb){
    const txt=cb.classList.contains("copy-all")?(PROMPTS[id]||[]).join("\n\n"):cb.closest(".pcard").querySelector("p").textContent;
    copyText(txt).then(ok=>flash(cb,ok));
    return;
  }
  if(e.target.closest(".check")){
    const st=get(id); st.done=!st.done; persist(); sync(el); update();
  }else if(e.target.closest(".toggle")){
    const open=el.classList.toggle("open");
    el.querySelector(".toggle").setAttribute("aria-expanded",open);
  }else if(e.target.closest(".save")){
    get(id).note=el.querySelector("textarea").value; persist(); sync(el);
    const m=el.querySelector(".saved"); m.classList.add("show");
    clearTimeout(m._t); m._t=setTimeout(()=>m.classList.remove("show"),1800);
  }
});
update();
</script>
