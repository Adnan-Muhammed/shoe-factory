<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b25">
<title>Juz 30 — Amma Juz Tracker</title>
<style>
:root {
  --bg:#f4f6f2;
  --surface:#fff;
  --ink:#172b25;
  --muted:#718078;
  --green:#176b50;
  --green2:#e7f3ed;
  --line:#e5ebe6;
  --shadow:0 12px 35px rgba(24,55,43,.07);
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}

header {
  background:linear-gradient(135deg,#102b25,#1d5944);
  color:white;
  padding:34px 20px 64px;
}

.hero { max-width:920px; margin:auto; }

.eyebrow {
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#b8d8c8;
  font-weight:700;
}

h1 {
  font-size:clamp(28px,5vw,42px);
  margin:10px 0 6px;
  letter-spacing:-.04em;
}

.subtitle {
  color:#d2e4da;
  margin:0;
  font-size:15px;
}

main {
  max-width:920px;
  margin:-38px auto 48px;
  padding:0 16px;
}

.panel {
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.progress-panel {
  padding:20px;
  margin-bottom:18px;
}

.progress-top {
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:13px;
}

.progress-number {
  font-size:26px;
  font-weight:800;
  color:var(--green);
}

.progress-label {
  font-size:13px;
  color:var(--muted);
}

.track {
  height:9px;
  background:#edf1ed;
  border-radius:20px;
  overflow:hidden;
}

.fill {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#176b50,#55a77e);
  border-radius:20px;
  transition:width .2s;
}

.progress-foot {
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
}

.toolbar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.search {
  flex:1 1 220px;
  min-width:0;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  background:white;
  font:inherit;
  outline:none;
}

.search:focus {
  border-color:#78a991;
}

select,.reset {
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 13px;
  background:white;
  color:var(--ink);
  font:inherit;
}

.reset {
  cursor:pointer;
  color:#9a443c;
}

.list { overflow:hidden; }

.list-head {
  padding:15px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.surah {
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px 18px;
  border-bottom:1px solid var(--line);
}

.surah:last-child { border-bottom:0; }

.surah.done { background:#f4faf6; }

/* Left column: reset button stacked above surah number */
.left-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.number {
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:11px;
  background:#f0f4f0;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:750;
  color:#52645a;
}

.surah.done .number {
  background:var(--green2);
  color:var(--green);
}

.details {
  min-width:0;
  flex:1;
}

.name-row {
  display:flex;
  align-items:baseline;
  gap:9px;
  flex-wrap:wrap;
}

.name {
  font-weight:700;
  font-size:15px;
}

.arabic {
  font-family:"Noto Naskh Arabic","Amiri",serif;
  font-size:21px;
  direction:rtl;
  color:#285c49;
}

.meta {
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.entry {
  width:135px;
  flex-shrink:0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}

.ayah-row {
  display: flex;
  align-items: center;
  gap: 5px;
}

.ayah-input {
  width:100%;
  padding:10px 9px;
  border:1px solid #dce5de;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  text-align:center;
  color:var(--green);
  outline:none;
  background:#fff;
  min-width: 0;
}

.ayah-input:focus {
  border-color:var(--green);
  box-shadow:0 0 0 3px #176b5018;
}

.ayah-input.invalid {
  border-color:#d64545;
  background:#fff5f5;
}

.mark-btn {
  border:1px solid var(--green);
  background:var(--green2);
  color:var(--green);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition: background .15s, color .15s;
}

.mark-btn:hover:not(:disabled) {
  background:var(--green);
  color:#fff;
}

.mark-btn:disabled {
  opacity:0.5;
  cursor:not-allowed;
}

/* Per-surah reset button */
.row-reset {
  border:1px solid #e4cfcf;
  background:#fdf6f6;
  color:#a04a42;
  border-radius:8px;
  padding:6px 9px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  line-height:1;
  flex:0 0 auto;
  transition: background .15s, color .15s;
}

.row-reset:hover {
  background:#a04a42;
  color:#fff;
  border-color:#a04a42;
}

.input-label {
  font-size:10px;
  color:var(--muted);
  text-align:center;
  margin-top:0;
}

.surah-progress {
  height:5px;
  background:#edf1ed;
  border-radius:10px;
  overflow:hidden;
  margin-top:9px;
}

.surah-progress-fill {
  height:100%;
  background:#55a77e;
  border-radius:10px;
}

.status {
  font-size:11px;
  margin-top:5px;
  color:var(--muted);
}

.status.done-text {
  color:var(--green);
  font-weight:700;
}

/* --- Marks / points --- */
.points-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
}

.points-input {
  width: 100%;
  padding: 7px 6px;
  border: 1px solid #dce5de;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  color: #2a5c4a;
  outline: none;
  background: #f9fcf9;
  min-width: 0;
}

.points-input:focus {
  border-color: var(--green);
  background: #ffffff;
  box-shadow: 0 0 0 3px #176b5010;
}

.points-input.invalid {
  border-color: #d64545;
  background: #fff5f5;
}

.points-label {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}

.points-max {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}

.empty {
  padding:35px;
  text-align:center;
  color:var(--muted);
}

footer {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:20px 8px;
}

@media(min-width:650px) {
  .surah { padding:16px 22px; }
  .progress-panel { padding:23px; }
  .list-head { padding:16px 22px; }
  .entry { width:160px; }
}

@media(max-width:480px) {
  header { padding-top:27px; }

  .surah {
    gap:9px;
    padding:14px 10px;
  }

  .number {
    width:31px;
    height:31px;
    flex-basis:31px;
  }

  .name { font-size:13px; }
  .arabic { font-size:18px; }

  .entry { width:110px; }

  .ayah-input {
    padding:9px 5px;
    font-size:15px;
  }

  .mark-btn {
    padding:6px 8px;
    font-size:11px;
  }

  .row-reset {
    padding:5px 7px;
    font-size:12px;
  }

  .points-input {
    padding: 5px 4px;
    font-size: 12px;
  }

  .progress-number { font-size:22px; }
}
</style>
</head>

<body>

<header>
  <div class="hero">
    <div class="eyebrow">Qur’an Reading Tracker · 30th Juz</div>
    <h1>Nafeesu Juzu Hifz tracker</h1>
    <p class="subtitle">
      Track your completed ayahs and marks through all 37 surahs.
    </p>
  </div>
</header>

<main>

  <!-- Overall Progress -->

  <section class="panel progress-panel">

    <div class="progress-top">

      <div>
        <div class="progress-label">Your progress</div>
        <div class="progress-number" id="percent">0%</div>
      </div>

      <div style="text-align:right">
        <div class="progress-number" id="count">0 / 37</div>
        <div class="progress-label">Surahs completed</div>
      </div>

    </div>

    <div class="track">
      <div class="fill" id="bar"></div>
    </div>

    <div class="progress-foot">
      <span id="remaining">37 remaining</span>
      <span id="totalAyahs">0 / 564 Ayahs</span>
    </div>

  </section>

  <!-- Search and Filter -->

  <div class="toolbar">

    <input
      class="search"
      id="search"
      type="search"
      placeholder="Search surah name or number..."
    >

    <select id="filter">
      <option value="all">All surahs</option>
      <option value="pending">Not completed</option>
      <option value="progress">In progress</option>
      <option value="done">Completed</option>
    </select>

    <button class="reset" id="reset" type="button" title="Reset all surahs">
      Reset all records
    </button>

  </div>

  <!-- Surah List -->

  <section class="panel list">

    <div class="list-head">
      <span>Surah List · Juz 30</span>
      <span>Completed Ayahs / Marks</span>
    </div>

    <div id="surahList"></div>

  </section>

  <footer>
    Progress is automatically saved in your browser's LocalStorage.
  </footer>

</main>

<script>

// =====================================
// CONFIGURATION
// =====================================

const MAX_MARKS_PER_SURAH = 20;

// =====================================
// SURAH DATA
// =====================================

const surahs = [
[78,"An-Naba","النبأ",40],
[79,"An-Nazi'at","النازعات",46],
[80,"Abasa","عبس",42],
[81,"At-Takwir","التكوير",29],
[82,"Al-Infitar","الانفطار",19],
[83,"Al-Mutaffifin","المطففين",36],
[84,"Al-Inshiqaq","الانشقاق",25],
[85,"Al-Buruj","البروج",22],
[86,"At-Tariq","الطارق",17],
[87,"Al-A'la","الأعلى",19],
[88,"Al-Ghashiyah","الغاشية",26],
[89,"Al-Fajr","الفجر",30],
[90,"Al-Balad","البلد",20],
[91,"Ash-Shams","الشمس",15],
[92,"Al-Layl","الليل",21],
[93,"Ad-Duha","الضحى",11],
[94,"Ash-Sharh","الشرح",8],
[95,"At-Tin","التين",8],
[96,"Al-Alaq","العلق",19],
[97,"Al-Qadr","القدر",5],
[98,"Al-Bayyinah","البينة",8],
[99,"Az-Zalzalah","الزلزلة",8],
[100,"Al-Adiyat","العاديات",11],
[101,"Al-Qari'ah","القارعة",11],
[102,"At-Takathur","التكاثر",8],
[103,"Al-Asr","العصر",3],
[104,"Al-Humazah","الهمزة",9],
[105,"Al-Fil","الفيل",5],
[106,"Quraysh","قريش",4],
[107,"Al-Ma'un","الماعون",7],
[108,"Al-Kawthar","الكوثر",3],
[109,"Al-Kafirun","الكافرون",6],
[110,"An-Nasr","النصر",3],
[111,"Al-Masad","المسد",5],
[112,"Al-Ikhlas","الإخلاص",4],
[113,"Al-Falaq","الفلق",5],
[114,"An-Nas","الناس",6]
];

// =====================================
// LOCAL STORAGE
// =====================================

const STORAGE_KEY = "juz-amma-ayah-progress-v2";

function loadProgress() {

  try {

    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "{}"
    );

    const clean = {};

    surahs.forEach(s => {

      const entry = saved[s[0]] || {};
      const ayahValue = Number(entry.ayahs);
      const marksValue = Number(entry.marks);

      if (
        Number.isInteger(ayahValue) &&
        ayahValue >= 0 &&
        ayahValue <= s[3]
      ) {
        clean[s[0]] = { ayahs: ayahValue, marks: 0 };
      } else {
        clean[s[0]] = { ayahs: 0, marks: 0 };
      }

      if (
        Number.isInteger(marksValue) &&
        marksValue >= 0 &&
        marksValue <= MAX_MARKS_PER_SURAH
      ) {
        clean[s[0]].marks = marksValue;
      }

    });

    return clean;

  } catch (error) {

    const clean = {};
    surahs.forEach(s => {
      clean[s[0]] = { ayahs: 0, marks: 0 };
    });
    return clean;

  }

}

let completed = loadProgress();

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
  } catch (error) {
    alert("Unable to save progress. Check browser storage.");
  }
}

// =====================================
// ELEMENTS
// =====================================

const list = document.getElementById("surahList");
const search = document.getElementById("search");
const filter = document.getElementById("filter");

// =====================================
// OVERALL PROGRESS
// =====================================

function updateProgress() {

  const totalSurahs = surahs.length;

  const completedSurahs = surahs.filter(
    s => completed[s[0]].ayahs === s[3]
  ).length;

  const totalAyahs = surahs.reduce(
    (sum, s) => sum + s[3], 0
  );

  const completedAyahs = surahs.reduce(
    (sum, s) => sum + completed[s[0]].ayahs, 0
  );

  const percentage = Math.round(
    completedSurahs / totalSurahs * 100
  );

  document.getElementById("count").textContent =
    `${completedSurahs} / ${totalSurahs}`;

  document.getElementById("percent").textContent =
    percentage + "%";

  document.getElementById("bar").style.width =
    percentage + "%";

  document.getElementById("remaining").textContent =
    `${totalSurahs - completedSurahs} remaining`;

  document.getElementById("totalAyahs").textContent =
    `${completedAyahs} / ${totalAyahs} Ayahs`;

}

// =====================================
// RENDER SURAH LIST
// =====================================

function render() {

  const query = search.value.trim().toLowerCase();
  const mode = filter.value;

  const visible = surahs.filter(s => {

    const entry = completed[s[0]];
    const value = entry.ayahs;
    const isDone = value === s[3];
    const inProgress = value > 0 && !isDone;

    const matches =
      (s[0] + " " + s[1] + " " + s[2])
      .toLowerCase()
      .includes(query);

    return matches &&
      (
        mode === "all" ||
        (mode === "done" && isDone) ||
        (mode === "progress" && inProgress) ||
        (mode === "pending" && value === 0)
      );

  });

  list.innerHTML = "";

  if (!visible.length) {
    list.innerHTML =
      '<div class="empty">No surahs match your search.</div>';
    updateProgress();
    return;
  }

  visible.forEach(s => {

    const [number, name, arabic, total] = s;

    const entry = completed[number];
    const value = entry.ayahs;
    const currentMarks = entry.marks;

    const isDone = value === total;

    const percentage = Math.round(
      value / total * 100
    );

    const row = document.createElement("div");

    row.className = "surah" + (
      isDone ? " done" : ""
    );

    // ---- LEFT STACK: reset button on top, number below (vertical) ----
    const leftStack = document.createElement("div");
    leftStack.className = "left-stack";

    const rowReset = document.createElement("button");
    rowReset.type = "button";
    rowReset.className = "row-reset";
    rowReset.textContent = "↺";
    rowReset.title = `Reset records for ${name}`;
    rowReset.setAttribute("aria-label", `Reset records for ${name}`);

    const num = document.createElement("span");
    num.className = "number";
    num.textContent = number;

    leftStack.append(rowReset, num);

    // Details
    const details = document.createElement("div");
    details.className = "details";

    const nameRow = document.createElement("div");
    nameRow.className = "name-row";

    const english = document.createElement("span");
    english.className = "name";
    english.textContent = name;

    const ar = document.createElement("span");
    ar.className = "arabic";
    ar.lang = "ar";
    ar.textContent = arabic;

    nameRow.append(english, ar);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `Total ${total} Ayahs`;

    // Individual progress bar
    const progressTrack = document.createElement("div");
    progressTrack.className = "surah-progress";

    const progressFill = document.createElement("div");
    progressFill.className = "surah-progress-fill";
    progressFill.style.width = percentage + "%";

    progressTrack.append(progressFill);

    // Status
    const status = document.createElement("div");
    status.className = "status";

    if (isDone) {
      status.textContent = "✓ Fully Completed";
      status.classList.add("done-text");
    } else if (value > 0) {
      status.textContent =
        `${value} / ${total} Ayahs completed · ${percentage}%`;
    } else {
      status.textContent = "Not started";
    }

    details.append(nameRow, meta, progressTrack, status);

    // Ayah input + Mark button
    const entryDiv = document.createElement("div");
    entryDiv.className = "entry";

    const ayahRow = document.createElement("div");
    ayahRow.className = "ayah-row";

    const input = document.createElement("input");
    input.type = "number";
    input.className = "ayah-input";
    input.min = "0";
    input.max = String(total);
    input.step = "1";
    input.inputMode = "numeric";
    input.value = value;

    input.setAttribute(
      "aria-label",
      `Completed Ayahs for ${name}, maximum ${total}`
    );
    input.title = `Enter a number from 0 to ${total}`;

    const markBtn = document.createElement("button");
    markBtn.type = "button";
    markBtn.className = "mark-btn";
    markBtn.textContent = "Mark";
    markBtn.title = `Mark all ${total} Ayahs as completed`;

    if (isDone) {
      markBtn.disabled = true;
    }

    // ---- AYAH INPUT: STRICT KEY-LEVEL PREVENTION ----
    input.addEventListener("keydown", (e) => {
      const allowedControlKeys = [
        "Backspace", "Delete", "Tab", "Escape", "Enter",
        "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
        "Home", "End"
      ];
      if (allowedControlKeys.includes(e.key)) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key.length !== 1 || !/^\d$/.test(e.key)) {
        if (!/[\d]/.test(e.key)) {
          e.preventDefault();
        }
        return;
      }

      const currentVal = input.value;
      const selStart = input.selectionStart ?? currentVal.length;
      const selEnd = input.selectionEnd ?? currentVal.length;

      const proposed =
        currentVal.slice(0, selStart) +
        e.key +
        currentVal.slice(selEnd);

      if (proposed !== "") {
        const proposedNum = Number(proposed);
        if (
          !Number.isInteger(proposedNum) ||
          proposedNum < 0 ||
          proposedNum > total
        ) {
          e.preventDefault();
          return;
        }
      }
    });

    input.addEventListener("input", () => {
      const raw = input.value;
      if (raw === "") return;

      const numberValue = Number(raw);
      if (
        !Number.isInteger(numberValue) ||
        numberValue < 0 ||
        numberValue > total
      ) {
        input.value = completed[number].ayahs;
        return;
      }

      completed[number].ayahs = numberValue;
      saveProgress();
      updateRow();
      markBtn.disabled = (numberValue === total);
    });

    input.addEventListener("blur", () => {
      if (input.value === "") {
        input.value = completed[number].ayahs;
      }
      input.classList.remove("invalid");
      input.setCustomValidity("");
    });

    input.addEventListener("paste", (e) => {
      const paste = (e.clipboardData || window.clipboardData)
        .getData("text")
        .trim();
      if (!/^\d+$/.test(paste)) {
        e.preventDefault();
        return;
      }
      const currentVal = input.value;
      const selStart = input.selectionStart ?? currentVal.length;
      const selEnd = input.selectionEnd ?? currentVal.length;
      const proposed =
        currentVal.slice(0, selStart) +
        paste +
        currentVal.slice(selEnd);
      if (proposed !== "" && Number(proposed) > total) {
        e.preventDefault();
      }
    });

    markBtn.addEventListener("click", () => {
      const current = completed[number].ayahs;
      if (current < total) {
        completed[number].ayahs = total;
        saveProgress();
        input.value = total;
        updateRow();
        markBtn.disabled = true;
      }
    });

    const inputLabel = document.createElement("div");
    inputLabel.className = "input-label";
    inputLabel.textContent = `/ ${total} Ayahs`;

    ayahRow.append(input, markBtn);

    // ---- MARKS / POINTS INPUT (max = 20) ----
    const pointsRow = document.createElement("div");
    pointsRow.className = "points-row";

    const pointsInput = document.createElement("input");
    pointsInput.type = "number";
    pointsInput.className = "points-input";
    pointsInput.min = "0";
    pointsInput.max = String(MAX_MARKS_PER_SURAH);
    pointsInput.step = "1";
    pointsInput.inputMode = "numeric";
    pointsInput.value = currentMarks;
    pointsInput.placeholder = "Marks";
    pointsInput.title = `Record marks/points for this surah (0–${MAX_MARKS_PER_SURAH})`;

    pointsInput.setAttribute(
      "aria-label",
      `Marks or points for ${name}, maximum ${MAX_MARKS_PER_SURAH}`
    );

    pointsInput.addEventListener("keydown", (e) => {
      const allowedControlKeys = [
        "Backspace", "Delete", "Tab", "Escape", "Enter",
        "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
        "Home", "End"
      ];
      if (allowedControlKeys.includes(e.key)) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key.length !== 1 || !/^\d$/.test(e.key)) {
        if (!/[\d]/.test(e.key)) {
          e.preventDefault();
        }
        return;
      }

      const currentVal = pointsInput.value;
      const selStart = pointsInput.selectionStart ?? currentVal.length;
      const selEnd = pointsInput.selectionEnd ?? currentVal.length;

      const proposed =
        currentVal.slice(0, selStart) +
        e.key +
        currentVal.slice(selEnd);

      if (proposed !== "") {
        const proposedNum = Number(proposed);
        if (
          !Number.isInteger(proposedNum) ||
          proposedNum < 0 ||
          proposedNum > MAX_MARKS_PER_SURAH
        ) {
          e.preventDefault();
          return;
        }
      }
    });

    pointsInput.addEventListener("input", () => {
      const raw = pointsInput.value;
      if (raw === "") return;

      const numVal = Number(raw);
      if (
        !Number.isInteger(numVal) ||
        numVal < 0 ||
        numVal > MAX_MARKS_PER_SURAH
      ) {
        pointsInput.value = completed[number].marks;
        return;
      }

      pointsInput.classList.remove("invalid");
      pointsInput.setCustomValidity("");
      completed[number].marks = numVal;
      saveProgress();
    });

    pointsInput.addEventListener("blur", () => {
      if (pointsInput.value === "") {
        pointsInput.value = completed[number].marks;
      }
      pointsInput.classList.remove("invalid");
      pointsInput.setCustomValidity("");
    });

    pointsInput.addEventListener("paste", (e) => {
      const paste = (e.clipboardData || window.clipboardData)
        .getData("text")
        .trim();
      if (!/^\d+$/.test(paste)) {
        e.preventDefault();
        return;
      }
      const currentVal = pointsInput.value;
      const selStart = pointsInput.selectionStart ?? currentVal.length;
      const selEnd = pointsInput.selectionEnd ?? currentVal.length;
      const proposed =
        currentVal.slice(0, selStart) +
        paste +
        currentVal.slice(selEnd);
      if (
        proposed !== "" &&
        Number(proposed) > MAX_MARKS_PER_SURAH
      ) {
        e.preventDefault();
      }
    });

    const pointsLabel = document.createElement("div");
    pointsLabel.className = "points-label";
    pointsLabel.textContent = "Marks";

    const pointsMax = document.createElement("div");
    pointsMax.className = "points-max";
    pointsMax.textContent = `/ ${MAX_MARKS_PER_SURAH}`;

    pointsRow.append(pointsInput, pointsLabel, pointsMax);

    entryDiv.append(ayahRow, inputLabel, pointsRow);

    // ---- UPDATE ROW ----
    function updateRow() {
      const current = completed[number].ayahs;
      const currentPercentage = Math.round(
        current / total * 100
      );
      const finished = current === total;

      row.classList.toggle("done", finished);
      progressFill.style.width = currentPercentage + "%";

      if (finished) {
        status.textContent = "✓ Fully Completed";
        status.classList.add("done-text");
      } else if (current > 0) {
        status.textContent =
          `${current} / ${total} Ayahs completed · ${currentPercentage}%`;
        status.classList.remove("done-text");
      } else {
        status.textContent = "Not started";
        status.classList.remove("done-text");
      }

      markBtn.disabled = finished;
      updateProgress();
    }

    // Reset handler
    rowReset.addEventListener("click", () => {
      if (
        confirm(
          `Reset all records for "${name}" (ayahs + marks)?`
        )
      ) {
        completed[number].ayahs = 0;
        completed[number].marks = 0;
        saveProgress();

        input.value = 0;
        pointsInput.value = 0;
        markBtn.disabled = false;
        updateRow();
      }
    });

    // Row order: left stack (reset above number), details, entry
    row.append(leftStack, details, entryDiv);
    list.append(row);

  });

  updateProgress();

}

// =====================================
// SEARCH AND FILTER
// =====================================

search.addEventListener("input", render);
filter.addEventListener("change", render);

// =====================================
// RESET ALL PROGRESS
// =====================================

document.getElementById("reset").addEventListener(
  "click",
  () => {

    if (
      confirm(
        "⚠️ Clear ALL records for every surah (ayahs + marks)?\n\nThis cannot be undone."
      )
    ) {

      surahs.forEach(s => {
        completed[s[0]].ayahs = 0;
        completed[s[0]].marks = 0;
      });

      saveProgress();
      render();

    }

  }
);

// =====================================
// INITIAL LOAD
// =====================================

render();

</script>
